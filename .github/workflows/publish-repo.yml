name: Publish Kodi repo

# Publishes this fork as a Kodi repository on gh-pages, the way
# Purple-Drain/TheRedWizard publishes Redlight, so Kodi can install and update
# the fork from the repo URL instead of an adb push. Mirrors Purple-Drain/skin.arctic.fuse.3#31.
on:
  push:
    branches: [nexus]
    paths-ignore:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'Readme.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build repo (dist/)
        run: python3 tools/build-repo.py

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
